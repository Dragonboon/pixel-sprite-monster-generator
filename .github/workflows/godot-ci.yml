name: Godot 4.7.2 validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install graphical test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Download Godot 4.7.2
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Import, regression and rendered export
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a python3 scripts/run_tests.py --godot "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --render
      - name: Save rendered evidence
        uses: actions/upload-artifact@v4
        with:
          name: generated-png
          path: ~/.local/share/godot/app_userdata/**/*-test.png
          if-no-files-found: error
